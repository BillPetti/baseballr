# Coverage with covr, following r-lib/actions' test-coverage example and the
# sportsdataverse house version (cfbfastR, hoopR, wehoop).
#
# NOT_CRAN=true so tests guarded by skip_on_cran() run, as they do locally.
# The *_TESTS flags match R-CMD-check.yaml.
#
# The Codecov upload is non-fatal (continue-on-error on the step): it depends
# on the CODECOV_TOKEN secret and on codecov.io being up, neither of which says
# anything about the package. The coverage summary is always printed by the
# "Test coverage" step.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FANGRAPHS_TESTS: "1"
      MLB_STATS_TESTS: "1"
      BREF_TESTS: "0"
      STATCAST_TESTS: "1"
      NCAA_BASEBALL_TESTS: "0"
      SPOTRAC_TESTS: "1"
      CHADWICK_TESTS: "1"
      BASEBALLR_LOAD_TESTS: "1"
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
