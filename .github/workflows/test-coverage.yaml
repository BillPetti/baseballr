# Coverage with covr, following r-lib/actions' test-coverage example and the
# sportsdataverse house version (cfbfastR, hoopR, wehoop).
#
# NOT_CRAN=true so tests guarded by skip_on_cran() run, as they do locally.
# The *_TESTS flags match R-CMD-check.yaml.
#
# The Codecov upload is non-fatal (continue-on-error on the step): it depends
# on the CODECOV_TOKEN secret and on codecov.io being up, neither of which says
# anything about the package. The coverage summary is always printed by the
# "Test coverage" step.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      pct: ${{ steps.cov.outputs.pct }}
    env:
      FANGRAPHS_TESTS: "1"
      MLB_STATS_TESTS: "1"
      BREF_TESTS: "0"
      STATCAST_TESTS: "1"
      NCAA_BASEBALL_TESTS: "0"
      SPOTRAC_TESTS: "1"
      CHADWICK_TESTS: "1"
      BASEBALLR_LOAD_TESTS: "1"
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        id: cov
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
          cat(sprintf("pct=%.1f\n", covr::percent_coverage(cov)), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

  # Self-hosted coverage badge: Codecov can't be set up for this repo, so the total is
  # written as a shields.io endpoint JSON to the `badges` branch and the README badge
  # reads it from raw.githubusercontent.com. Runs only for master, never for PRs.
  badge:
    needs: test-coverage
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.test-coverage.outputs.pct != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - name: Publish coverage.json to the badges branch
        env:
          PCT: ${{ needs.test-coverage.outputs.pct }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          color=$(awk -v p="$PCT" 'BEGIN { print (p>=80?"brightgreen":p>=60?"green":p>=40?"yellow":p>=20?"orange":"red") }')
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" badges >/dev/null; then
            git clone --quiet --depth 1 --branch badges "$url" badges
          else
            git init --quiet -b badges badges && git -C badges remote add origin "$url"
          fi
          cd badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" > coverage.json
          git add coverage.json
          if git diff --cached --quiet; then echo "coverage unchanged ($PCT%)"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "coverage: ${PCT}% (${GITHUB_SHA::7})"
          git push --quiet origin badges
